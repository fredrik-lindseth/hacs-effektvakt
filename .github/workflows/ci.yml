name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release-maskineriet (hacs-effektvakt-2xu0h57) kaller denne for
  # kandidat-SHA-en sin og venter på hele grafen før det publiserer. Når
  # release.yml finnes, skal push-triggeren over bort: da eier release.yml
  # main, og to kjøringer av samme ting er to svar å velge mellom.
  workflow_call:

# CI kaller de samme just-oppskriftene som kjøres lokalt og av pre-commit.
# Kommandolinjene står ett sted, i justfile, så en rød port kan reproduseres
# med `just check` eller `just test-unit` uten å lese denne filen.
#
# HACS- og hassfest-valideringen hører hjemme her og ikke bare i validate.yml:
# release-gaten kan ikke vente på noe den ikke ser. validate.yml kjører de to
# om igjen om natten, fordi begge kan bli røde av endringer utenfor repoet.

permissions:
  contents: read

jobs:
  test-unit:
    name: Unit (stubbet HA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        # Pinnet eksakt, ikke @v10: Astral sluttet å publisere major- og
        # minortagger fra v8.0.0, så @v10 finnes ikke. Bumpes for hånd.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      # Fixturene lå som symlink ut av repoet til september 2026, og da skippet
      # replay-testene seg selv i CI. Feller vi her, ser vi det med en gang.
      - name: Replay-fixturer finnes
        run: |
          n=$(ls tests/fixtures/bkk_*_hourly.json 2>/dev/null | wc -l)
          [ "$n" -ge 9 ] || { echo "Fant bare $n replay-fixturer"; exit 1; }

      - name: Unit tests with coverage
        run: just coverage-unit

      # Coverage-tallet er nyttig, men det er ikke en test, og dekning skal
      # ikke avgjøre om CI er grønn: terskelen står i coverage-jobben, som
      # venter på begge suitene. `fail_ci_if_error: false` dekker feil Codecov
      # selv rapporterer, continue-on-error dekker resten, som at actionen
      # ikke svarer.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: false

      - name: Ta vare på coverage-dataene til den samlede gaten
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Den samme integrasjonen mot to ekte Home Assistant-versjoner: den
  # hacs.json lover brukerne, og den nyeste vi har sett på. Feller minimum, er
  # det enten en kompatibilitetsfeil å rette eller et minimum å heve med
  # vilje. `fail-fast: false` fordi svaret «begge ryker» er et annet svar enn
  # «bare den ene», og det er gratis å få vite hvilket.
  test-ha:
    name: Ekte Home Assistant (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [minimum, current]
        # Coverage måles bare på current; se coverage-ha i justfile.
        include:
          - target: minimum
            oppskrift: test-ha minimum
          - target: current
            oppskrift: coverage-ha
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Ekte-HA-tester
        run: just ${{ matrix.oppskrift }}

      - name: Upload coverage to Codecov
        if: matrix.target == 'current'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-ha.xml
          disable_search: true
          flags: ha
          fail_ci_if_error: false

      - name: Ta vare på coverage-dataene til den samlede gaten
        if: matrix.target == 'current'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-ha
          path: .coverage.ha
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Terskelen leser summen av de to suitene, aldri én av dem alene: hver av
  # dem lar kode stå udekket som den andre dekker. Derfor en egen jobb som
  # venter på begge og henter datafilene deres.
  coverage:
    name: Coverage (samlet, minst 95 %)
    needs: [test-unit, test-ha]
    runs-on: ubuntu-latest
    steps:
      # Kildene trengs for rapporten over manglende linjer.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Hent coverage-dataene
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Coverage-terskel
        run: just coverage-gate

  check:
    name: Kvalitet (ruff, mypy, vulture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout effektvakt
        uses: actions/checkout@v6

      # Commiten står i scripts/dso_kilder.json, så workflowen og generatoren
      # ikke kan peke på hver sin versjon av tariffene.
      - name: Finn pinnet fri-nettleie-commit
        id: frinett
        run: echo "commit=$(jq -r '._meta.commit' scripts/dso_kilder.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout fri-nettleie
        uses: actions/checkout@v6
        with:
          repository: kraftsystemet/fri-nettleie
          ref: ${{ steps.frinett.outputs.commit }}
          path: _fri-nettleie

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Lint, format, typer og død kode
        run: just check

      - name: Verify DSO-tabell mot fri-nettleie
        run: just dso-sjekk _fri-nettleie

      - name: Manifest valid JSON
        run: jq empty custom_components/effektvakt/manifest.json

      # manifest.json og pyproject.toml sto på 0.3.0 og 0.1.0 i september 2026
      # uten at noe felte. Dette steget er det som gjør det umulig igjen.
      - name: Versjonsformat og -synk
        run: |
          VERSION=$(jq -r '.version' custom_components/effektvakt/manifest.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ugyldig versjonsformat i manifest.json: $VERSION"
            exit 1
          fi
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$VERSION" != "$PYPROJECT_VERSION" ]]; then
            echo "Versjonsdrift: manifest.json ($VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi

      - name: Required files present
        run: |
          for f in \
            custom_components/effektvakt/__init__.py \
            custom_components/effektvakt/manifest.json \
            custom_components/effektvakt/config_flow.py \
            custom_components/effektvakt/coordinator.py \
            custom_components/effektvakt/sensor.py \
            custom_components/effektvakt/binary_sensor.py \
            custom_components/effektvakt/const.py \
            custom_components/effektvakt/dso.py \
            README.md \
            CHANGELOG.md \
            LICENSE; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done

  # De to validatorene kjører mot `@main` og `@master` hos andre, og de snakker
  # med GitHubs API. Er de trege eller ustabile, blokkerer de framfor å slippe
  # noe gjennom, og det er riktig vei å feile. Timeouten er der for at en
  # hengende validator ikke skal holde en kjøring i timevis.
  hacs:
    name: HACS-validering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  # Én jobb å kreve grønn i grenbeskyttelsen, og den release-maskineriet venter
  # på. `if: always()` er nødvendig for at den skal kjøre når en av de andre
  # feiler; da er hele poenget å rapportere hvem. skipped og cancelled teller
  # som feil: en jobb som ikke kjørte har ikke sagt at noe er i orden.
  release-gate:
    name: Releaseport
    if: always()
    needs: [test-unit, test-ha, coverage, check, hacs, hassfest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Krev grønt fra alle jobbene
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          required = ("test-unit", "test-ha", "coverage", "check", "hacs", "hassfest")
          blocked = []
          for job in required:
              result = results.get(job, {}).get("result", "missing")
              print(f"{job}: {result}")
              if result != "success":
                  blocked.append(f"{job}: {result}")
          if blocked:
              print("::error::Release stoppet: " + ", ".join(blocked))
              sys.exit(1)
          PY
