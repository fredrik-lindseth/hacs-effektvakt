name: Validate (nattlig)

# De samme to valideringene kjøres i ci.yml for hver PR og hver
# releasekandidat. Denne kjører dem om igjen hver natt, fordi `hacs/action@main`
# og hassfest kan bli strengere uten at noe i repoet er endret. Da vil vi vite
# det før neste release, ikke i releasen.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS-validering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
