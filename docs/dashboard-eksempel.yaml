# Lim inn som et helt dashbord i «Rediger i YAML». Kortet følger integrasjonen.
# Bytt BYTT_MEG til din kumulative importmåler i kWh med langtidsstatistikk,
# eller fjern ukesgrafen. Se docs/input-sensorer.md.
# Entitetsnavnene gjelder ett oppsett med standardnavn. Har du omdøpt dem
# eller flere oppsett, tilpass alle referansene til samme Effektvakt-oppsett.
# Valgfrie sensorer vises bare når de finnes og har en kjent verdi.

title: Effektvakt
views:
  - title: Oversikt
    cards:
      - type: vertical-stack
        cards:
          - type: custom:effektvakt-card
            entity: sensor.effektvakt_projisert_time_snitt
            tittel: Effektvakt
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.BYTT_MEG_energi_total
                state_not: unknown
              - condition: state
                entity: sensor.BYTT_MEG_energi_total
                state_not: unavailable
            card:
              type: statistics-graph
              title: Timesforbruk siste uke (kWh)
              chart_type: bar
              period: hour
              days_to_show: 7
              stat_types: [change]
              entities:
                - entity: sensor.BYTT_MEG_energi_total
                  name: Import fra strømmåleren
      - type: vertical-stack
        cards:
          - type: markdown
            content: |-
              {% set p = 'sensor.effektvakt_projisert_time_snitt' %}
              {% set k = 'sensor.effektvakt_kostnad_neste_trinn' %}
              {% macro kw(v) %}{{ v | round(1) | string | replace('.0', '') | replace('.', ',') }}{% endmacro %}
              {% set igjen = state_attr(p, 'minutter_igjen_av_timen') %}
              {% set paa = state_attr(p, 'kan_legge_paa_resten_av_timen_kw') %}
              {% set tak = state_attr(p, 'time_tak_kw') %}
              {% set timen = states(k) %}
              {% if state_attr(p, 'beregning_gyldig') is not true or igjen is none %}
              ## Venter på beregningsgrunnlag
              Målinger eller tariffgrunnlag mangler. Ingen sikre råd om margin eller kostnad ennå.
              {% else %}
              ## {{ igjen }} min igjen av timen
              {% if paa is not none and tak is not none %}
              {% if paa > 0 %}
              Du kan legge på **{{ kw(paa) }} kW** resten av timen innenfor timens tak på {{ kw(tak) }} kW.
              {% else %}
              Ingen ekstra last innenfor timens tak på {{ kw(tak) }} kW.
              {% endif %}
              {% else %}
              Måneden ligger allerede på øverste kapasitetstrinn.
              {% endif %}
              {% if not is_number(timen) %}
              Timens tariffvirkning er ukjent.
              {% elif timen | float > 0 %}
              Denne timen kan øke månedens kapasitetsledd med **{{ timen | float | round | int }} kr** hvis den avsluttes som anslått.
              {% else %}
              Denne timen øker ikke kapasitetsleddet med dagens anslag.
              {% endif %}
              {% if state_attr(k, 'trinn_under_realistisk') %}
              {% if state_attr(k, 'trinn_under_oppnaelig') %}
              Trinnet under er fortsatt mulig og {{ state_attr(k, 'besparelse_trinn_under_kr') | round | int }} kr billigere. Det krever at månedens topp-3-snitt ender under {{ kw(state_attr(k, 'trinn_under_terskel_kw')) }} kW.
              {% else %}
              Trinnet under er ute av rekkevidde denne måneden.
              {% endif %}
              {% endif %}
              {% endif %}
          - type: markdown
            content: |-
              {% set p = 'sensor.effektvakt_projisert_time_snitt' %}
              {% set status = state_attr(p, 'maal_status') %}
              {% set maal = state_attr(p, 'valgt_maal_kw') %}
              ## Månedsmål
              {% if status == 'aktiv' and maal is number %}
              Målet er **{{ maal | string | replace('.', ',') }} kW** og er fortsatt innen rekkevidde.
              {% elif status == 'tapt' %}
              Registrerte topper har gjort månedsmålet uoppnåelig. Det styrer ikke nye kutt.
              {% elif status == 'ikke_valgt' %}
              Ingen eget månedsmål valgt. Effektvakt vurderer neste kapasitetstrinn.
              {% else %}
              Månedsmålet kan ikke vurderes ennå.
              {% endif %}
              {% if is_state('switch.effektvakt_automatikk', 'off') %}
              Hovedbryteren er av. Tilknyttede blueprints gjør ingen nye kutt.
              {% elif is_state('switch.effektvakt_automatikk', 'on') %}
              Hovedbryteren er på. Lastkutt krever også en aktiv automasjon fra en blueprint.
              {% else %}
              Hovedbryterens tilstand er ukjent.
              {% endif %}
          - type: markdown
            content: |-
              {% set s = 'sensor.effektvakt_tilgjengelig_kutt' %}
              {% set kilder = state_attr(s, 'kutt_kilder') %}
              ## Hva kan kuttes nå
              {% if kilder is none %}
              Ingen målte kuttkilder tilgjengelige. Registrer laster med effektsensor under Effektvakt → Konfigurer. Manuelle profiler vises i anslaget under.
              {% else %}
              {% for kilde in kilder %}
              **{{ kilde.navn or kilde.entity_id }}**: {% if kilde.kuttet %}kuttet av Effektvakt{% elif kilde.effekt_w is none %}ukjent måling{% elif kilde.teller_med %}{{ (kilde.effekt_w / 1000) | round(1) | string | replace('.', ',') }} kW{% else %}under terskelen{% endif %}
              {% endfor %}
              {% if is_number(states(s)) %}
              Målt tilgjengelig kutt: **{{ states(s) | float | round(1) | string | replace('.', ',') }} kW**.
              {% if kilder | selectattr('effekt_w', 'none') | list | count > 0 %}
              Noen laster mangler måling og er ikke med i summen.
              {% endif %}
              {% else %}
              Summen er ukjent.
              {% endif %}
              {% endif %}
          - type: markdown
            content: |-
              {% set s = 'sensor.effektvakt_estimert_kuttenergi_resten_av_timen' %}
              {% set profiler = state_attr(s, 'lastprofiler') %}
              ## Profilanslag resten av timen
              {% if profiler is none %}
              Ingen profilgrunnlag tilgjengelig. Lastprofiler er valgfrie i oppsettet.
              {% else %}
              {% if is_number(states(s)) %}
              Estimert kuttenergi: **{{ states(s) | float | round(2) | string | replace('.', ',') }} kWh**.
              {% else %}
              Samlet anslag er ukjent; en eller flere profiler mangler grunnlag.
              {% endif %}
              {% for navn, profil in profiler.items() %}
              **{{ navn }}**: {% if profil.arbeidssyklus_pct is number %}{{ profil.arbeidssyklus_pct | round(1) | string | replace('.', ',') }} % arbeidssyklus{% else %}ukjent profil{% endif %}{% if profil.planleggingsestimat %}, manuelt planleggingsanslag{% endif %}.
              {% endfor %}
              Dette er et anslag på utsatt forbruk, ikke målt sparing. Manuelle profiler uten effektmåling gir ikke automatiske kuttbidrag.
              {% endif %}
  - title: Sensorer
    cards:
      - type: entities
        title: Effektvakt
        entities:
          - sensor.effektvakt_risiko_niva
          - sensor.effektvakt_projisert_time_snitt
          - sensor.effektvakt_margin_til_neste_trinn
          - sensor.effektvakt_topp_3_snitt_denne_maned
          - sensor.effektvakt_kostnad_neste_trinn
          - binary_sensor.effektvakt_kutt_ned_anbefalt
          - switch.effektvakt_automatikk
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.effektvakt_tilgjengelig_kutt
            state_not: unknown
          - condition: state
            entity: sensor.effektvakt_tilgjengelig_kutt
            state_not: unavailable
        card:
          type: entities
          entities:
            - sensor.effektvakt_tilgjengelig_kutt
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.effektvakt_estimert_kuttenergi_resten_av_timen
            state_not: unknown
          - condition: state
            entity: sensor.effektvakt_estimert_kuttenergi_resten_av_timen
            state_not: unavailable
        card:
          type: entities
          entities:
            - sensor.effektvakt_estimert_kuttenergi_resten_av_timen
      - type: history-graph
        title: Risiko siste 24t
        hours_to_show: 24
        entities: [sensor.effektvakt_risiko_niva]
      - type: history-graph
        title: Margin siste 24t
        hours_to_show: 24
        entities: [sensor.effektvakt_margin_til_neste_trinn]
