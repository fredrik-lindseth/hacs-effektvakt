blueprint:
  name: Effektvakt - Climate med min-temp
  description: >
    Sett climate-entitet (panelovn) til min-temp ved kutt anbefalt, og
    restore til lagret verdi når risiko er borte. Integrasjonens lastvern
    lagrer originaltemperaturen og gjenopptar ansvaret etter HA-restart.
    Setpunktet settes tilbake ved neste hele time, eller når sensoren går av,
    det som kommer først. Nettleien måles per time, så et kutt som varer inn i
    neste time flytter bare oppvarmingen dit. max_off_minutes er nødbremsen
    hvis Effektvakt henger.
  domain: automation
  source_url: https://raw.githubusercontent.com/fredrik-lindseth/hacs-effektvakt/main/docs/blueprints/climate_min_temp.yaml
  input:
    binary_sensor_entity:
      name: Effektvakt binary sensor
      default: binary_sensor.effektvakt_kutt_ned_anbefalt
      selector:
        entity:
          domain: binary_sensor
    climate_entity:
      name: Climate-entitet (panelovn)
      selector:
        entity:
          domain: climate
    min_temp:
      name: Min-temperatur ved kutt
      default: 10
      selector:
        number:
          min: 5
          max: 18
          unit_of_measurement: °C
    restore_helper:
      name: input_number for å lagre forrige temperatur
      description: Valgfritt felt fra eldre oppsett; lastvernet lagrer temperaturen selv.
      default: ""
      selector:
        entity:
          domain: input_number
    automatikk_switch:
      name: Effektvakt automatikk-bryter (valgfri)
      description: >
        Bryteren fra Effektvakt-integrasjonen, typisk
        switch.effektvakt_automatikk. Er den av, kutter ikke denne
        automasjonen. Lar du feltet stå tomt, kutter den alltid, slik den
        gjorde før bryteren fantes.
      default: ""
      selector:
        entity:
          domain: switch
          integration: effektvakt
    max_off_minutes:
      name: Absolutt tak for hvor lenge min-temp kan stå (minutter)
      description: >
        Nødbrems hvis Effektvakt henger. Normalt settes temperaturen tilbake
        ved timeskiftet lenge før taket nås.
      default: 60
      selector:
        number:
          min: 5
          max: 240
          step: 5
    min_on_minutes:
      name: Minste tid på normal temperatur før ny senking (minutter)
      description: >
        Etter et slipp ved timeskiftet får rommet varme opp igjen minst så
        lenge før setpunktet kan senkes på nytt.
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1

variables:
  max_off_minutes: !input max_off_minutes
  min_on_minutes: !input min_on_minutes
  automatikk_switch: !input automatikk_switch
  binary_sensor_entity: !input binary_sensor_entity
  climate_entity: !input climate_entity
  min_temp: !input min_temp

# Gjentatt vurdering tar opp vedvarende risiko etter minste paatid.
# Gjeninnkoblingen eies av integrasjonen og fortsetter ved automasjonsreload.
trigger:
  - platform: state
    entity_id: !input binary_sensor_entity
    to:
  - platform: time_pattern
    minutes: "/1"
  - platform: homeassistant
    event: start

mode: queued
max: 10

action:
  - service: effektvakt.styr_last
    data:
      entity_id: "{{ climate_entity }}"
      eier: "{{ this.entity_id }}"
      kutt: "{{ is_state(binary_sensor_entity, 'on') }}"
      automatikk_switch: "{{ automatikk_switch }}"
      max_off_minutes: "{{ max_off_minutes }}"
      min_on_minutes: "{{ min_on_minutes }}"
      min_temp: "{{ min_temp }}"
