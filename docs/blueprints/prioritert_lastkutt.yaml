blueprint:
  name: Effektvakt - Prioritert lastkutt
  description: >
    Slå av switches i prioritert rekkefølge etter hvor nær neste
    kapasitetstrinn timen ligger. Like under terskelen: første switch av.
    Over terskelen: alle switches av. Slår på igjen i revers rekkefølge
    når marginen kommer tilbake.
  domain: automation
  source_url: https://github.com/fredrik-lindseth/hacs-effektvakt/raw/main/docs/blueprints/prioritert_lastkutt.yaml
  input:
    risiko_sensor:
      name: Risiko-sensor
      default: sensor.effektvakt_risiko_niva
      selector:
        entity:
          domain: sensor
    switch_high_priority:
      name: Første switch som slås av (like under terskelen)
      selector:
        entity:
          domain: switch
    switch_medium_priority:
      name: Andre switch som slås av (over terskelen)
      selector:
        entity:
          domain: switch
    automatikk_switch:
      name: Effektvakt automatikk-bryter (valgfri)
      description: >
        Bryteren fra Effektvakt-integrasjonen, typisk
        switch.effektvakt_automatikk. Er den av, kutter ikke denne
        automasjonen. Lar du feltet stå tomt, kutter den alltid, slik den
        gjorde før bryteren fantes.
      default: ""
      selector:
        entity:
          domain: switch
          integration: effektvakt
    max_off_minutes:
      name: Maks minutter slått av før tving-on
      default: 30
      selector:
        number:
          min: 5
          max: 240
          step: 5

variables:
  switch_high: !input switch_high_priority
  switch_medium: !input switch_medium_priority
  max_off_minutes: !input max_off_minutes
  automatikk_switch: !input automatikk_switch

trigger:
  - platform: state
    entity_id: !input risiko_sensor

mode: restart

action:
  - choose:
      - conditions:
          # Begge kutt-grenene er gatet. Faller vi gjennom fordi bryteren er
          # av, tar default-grenen under over og slår alt på igjen.
          - condition: state
            entity_id: !input risiko_sensor
            state: "over_terskel"
          - condition: template
            value_template: >
              {{ automatikk_switch == '' or is_state(automatikk_switch, 'on') }}
        sequence:
          - service: switch.turn_off
            target:
              entity_id:
                - "{{ switch_high }}"
                - "{{ switch_medium }}"
          - delay:
              minutes: "{{ max_off_minutes }}"
          - service: switch.turn_on
            target:
              entity_id:
                - "{{ switch_high }}"
                - "{{ switch_medium }}"
      - conditions:
          - condition: state
            entity_id: !input risiko_sensor
            state: "like_under_terskel"
          - condition: template
            value_template: >
              {{ automatikk_switch == '' or is_state(automatikk_switch, 'on') }}
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ switch_high }}"
          - service: switch.turn_on
            target:
              entity_id: "{{ switch_medium }}"
          - delay:
              minutes: "{{ max_off_minutes }}"
          - service: switch.turn_on
            target:
              entity_id: "{{ switch_high }}"
    default:
      - service: switch.turn_on
        target:
          entity_id:
            - "{{ switch_high }}"
            - "{{ switch_medium }}"
