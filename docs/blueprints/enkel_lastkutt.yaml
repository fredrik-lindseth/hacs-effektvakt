blueprint:
  name: Effektvakt - Enkel lastkutt
  description: >
    Slå av én switch når Effektvakt signaliserer kutt anbefalt.
    Lasten kommer tilbake når sensoren går av, eller ved neste hele time,
    det som kommer først. Nettleien måles per time, så et kutt som varer
    inn i neste time flytter bare oppvarmingen dit og drar den timen opp.
    max_off_minutes er nødbremsen hvis Effektvakt henger.
  domain: automation
  source_url: https://raw.githubusercontent.com/fredrik-lindseth/hacs-effektvakt/main/docs/blueprints/enkel_lastkutt.yaml
  input:
    binary_sensor_entity:
      name: Effektvakt binary sensor
      description: Vanligvis binary_sensor.effektvakt_kutt_ned_anbefalt
      default: binary_sensor.effektvakt_kutt_ned_anbefalt
      selector:
        entity:
          domain: binary_sensor
    switch_entity:
      name: Switch å slå av (typisk VVB, billader)
      selector:
        entity:
          domain: switch
    automatikk_switch:
      name: Effektvakt automatikk-bryter (valgfri)
      description: >
        Bryteren fra Effektvakt-integrasjonen, typisk
        switch.effektvakt_automatikk. Er den av, kutter ikke denne
        automasjonen. Lar du feltet stå tomt, kutter den alltid, slik den
        gjorde før bryteren fantes.
      default: ""
      selector:
        entity:
          domain: switch
          integration: effektvakt
    max_off_minutes:
      name: Absolutt tak for hvor lenge lasten kan stå av (minutter)
      description: >
        Nødbrems hvis Effektvakt henger. Normalt slippes lasten ved
        timeskiftet lenge før taket nås. Setter du det under 60, kapper du
        kutt som ellers hadde vart ut timen.
      default: 60
      selector:
        number:
          min: 5
          max: 240
          step: 5
    min_on_minutes:
      name: Minste påtid før nytt kutt (minutter)
      description: >
        Etter et slipp ved timeskiftet får lasten stå på minst så lenge før
        den kan kuttes igjen, selv om Effektvakt fortsatt anbefaler kutt.
        Uten den ville berederen stått av gjennom to timer på rad.
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1

variables:
  max_off_minutes: !input max_off_minutes
  min_on_minutes: !input min_on_minutes
  automatikk_switch: !input automatikk_switch
  binary_sensor_entity: !input binary_sensor_entity
  switch_entity: !input switch_entity

# Gjentatt vurdering tar opp vedvarende risiko etter minste paatid.
# Gjeninnkoblingen eies av integrasjonen og fortsetter ved automasjonsreload.
trigger:
  - platform: state
    entity_id: !input binary_sensor_entity
    to:
  - platform: time_pattern
    minutes: "/1"
  - platform: homeassistant
    event: start

mode: queued
max: 10

action:
  - service: effektvakt.styr_last
    data:
      entity_id: "{{ switch_entity }}"
      eier: "{{ this.entity_id }}"
      kutt: "{{ is_state(binary_sensor_entity, 'on') }}"
      automatikk_switch: "{{ automatikk_switch }}"
      max_off_minutes: "{{ max_off_minutes }}"
      min_on_minutes: "{{ min_on_minutes }}"
