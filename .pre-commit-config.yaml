# Installer: pre-commit install && pre-commit install --hook-type pre-push
#
# Verktøyversjonene her er de samme som kvalitet-gruppa i pyproject.toml. Ulike
# versjoner lokalt og i hooken er et sprik som viser seg som «formateringen
# endret seg av seg selv».

# Alt utenom testsuiten hører hjemme på commit. Uten dette kjører hele settet
# på nytt ved push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [
          "custom_components/effektvakt",
          "vulture_whitelist.py",
          "--min-confidence", "80",
          "--exclude", "*test*",
        ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # !secret og !include er ESPHome- og HA-tags som check-yaml ikke kjenner
        exclude: ^(docs/blueprints/|esphome/)
      - id: check-json
      - id: check-added-large-files
        # Grensen er der for at binaere blobber ikke skal snike seg inn.
        # uv.lock er generert, tekst, og legitimt stor: 237 pakker over fire
        # grupper og to HA-grener.
        args: ['--maxkb=500']
        exclude: ^uv\.lock$

  # Mypy. Blokkerende, som i `just check` og i CI. Den var rådgivende med
  # `|| true` fram til september 2026, og samlet opp 26 feil ingen så. Samme
  # versjon som kvalitet-gruppa i pyproject.toml.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-error-summary]
        files: ^custom_components/effektvakt/
        pass_filenames: false
        additional_dependencies: []

  - repo: local
    hooks:
      - id: pytest
        name: pytest (just test-unit)
        # Kaller nøyaktig samme oppskrift som AGENTS.md og CI. Hooken har ikke
        # sitt eget miljø og sin egen kommandolinje: da kunne den gå grønn på
        # noe annet enn det de to andre kjører.
        entry: just test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: dso_kilde
        name: DSO-tabell mot fri-nettleie
        # Henter tariffene fra nett med mindre FRI_NETTLEIE_ROOT peker på en utsjekk
        entry: python3 scripts/generer_dso_fra_fri_nettleie.py --check
        language: system
        pass_filenames: false
        files: ^(custom_components/effektvakt/dso\.py|scripts/(generer_dso_fra_fri_nettleie\.py|dso_kilder\.json))$
