repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [
          "custom_components/effektvakt",
          "vulture_whitelist.py",
          "--min-confidence", "80",
          "--exclude", "*test*",
        ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # !secret og !include er ESPHome- og HA-tags som check-yaml ikke kjenner
        exclude: ^(docs/blueprints/|esphome/)
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: mypy
        name: mypy (warnings only)
        # HA-stubs mangler, mypy er informativ og blokkerer ikke commit
        entry: bash -c 'mypy --ignore-missing-imports --no-error-summary custom_components/effektvakt/ || true'
        language: system
        pass_filenames: false
        files: ^custom_components/effektvakt/

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests/ -v --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: dso_kilde
        name: DSO-tabell mot fri-nettleie
        # Henter tariffene fra nett med mindre FRI_NETTLEIE_ROOT peker på en utsjekk
        entry: python3 scripts/generer_dso_fra_fri_nettleie.py --check
        language: system
        pass_filenames: false
        files: ^(custom_components/effektvakt/dso\.py|scripts/(generer_dso_fra_fri_nettleie\.py|dso_kilder\.json))$
